openapi: 3.0.3
info:
  title: Loja Controle API
  version: 1.0.0-sprint1
  description: OpenAPI inicial para Sprint 1 (P0) — paths mínimos para integração
    Admin ↔ Loja.
paths:
  /config:
    get:
      summary: Get store config
      operationId: getConfig
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreConfig'
    post:
      summary: Save store config
      operationId: saveConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreConfig'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreConfig'
        '400':
          description: invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products:
    get:
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /products/bulk:
    post:
      summary: Create/Update products in bulk
      operationId: createOrUpdateProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: created
        '400':
          description: invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders:
    post:
      summary: Create order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List orders
      operationId: listOrders
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /auth/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      summary: Current user
      operationId: me
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /orders/{id}:
    patch:
      summary: Update order
      operationId: updateOrder
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPatch'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StoreConfig:
      type: object
      properties:
        storeName:
          type: string
        currency:
          type: string
          example: BRL
        whatsappNumber:
          type: string
        theme:
          type: object
          properties:
            primary:
              type: string
          additionalProperties: true
        logoUrl:
          type: string
          format: uri
        businessHours:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                example: mon
              open:
                type: string
                example: 09:00
              close:
                type: string
                example: '18:00'
            required:
            - day
            - open
            - close
        deliveryAreas:
          type: array
          items:
            type: string
        paymentMethods:
          type: array
          items:
            type: string
            enum:
            - pix
            - cash
            - card
      required:
      - storeName
      - currency
      - whatsappNumber
    Product:
      type: object
      properties:
        id:
          type: string
          example: cuid
        name:
          type: string
        price:
          type: number
        cost:
          type: number
        stock:
          type: integer
        description:
          type: string
        category:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            type: string
      required:
      - id
      - name
      - price
      - cost
      - stock
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
        qty:
          type: integer
          minimum: 1
        unitPrice:
          type: number
        subtotal:
          type: number
      required:
      - productId
      - name
      - qty
      - unitPrice
      - subtotal
    OrderCreate:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending
          - confirmed
          - canceled
          - delivered
          default: pending
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
        customer:
          $ref: '#/components/schemas/CustomerInline'
        channel:
          type: string
          enum:
          - web
          - whatsapp
          - admin
        notes:
          type: string
      required:
      - items
      - total
    OrderPatch:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending
          - confirmed
          - canceled
          - delivered
        notes:
          type: string
        total:
          type: number
    Order:
      type: object
      properties:
        id:
          type: string
          example: ord_123
        status:
          type: string
          enum:
          - pending
          - confirmed
          - canceled
          - delivered
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
        customer:
          $ref: '#/components/schemas/CustomerInline'
        channel:
          type: string
          enum:
          - web
          - whatsapp
          - admin
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - status
      - items
      - total
      - createdAt
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
    MeResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - operational
          - finance
      required:
      - id
      - name
      - role
    Error:
      type: object
      properties:
        message:
          type: string
        issues:
          type: array
          items:
            type: string
      required:
      - message
    CustomerInline:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
