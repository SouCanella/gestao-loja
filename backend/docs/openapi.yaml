openapi: 3.0.3
info: { title: Loja Controle • Backend P0, version: 1.0.1 }
servers: [ { url: http://localhost:4000 } ]
paths:
  /products:
    get:
      tags: [Products]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
  /products/bulk:
    post:
      tags: [Products]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  inserted: { type: integer }
                  updated: { type: integer }
  /orders:
    get:
      tags: [Orders]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
  /orders/{id}:
    patch:
      tags: [Orders]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '400': { description: Bad Request }
        '404': { description: Not Found }
components:
  schemas:
    Product: { type: object, properties: { id: {type:string}, name:{type:string}, price:{type:number} }, required: [name, price] }
    OrderItem: { type: object, properties: { productId:{type:string}, qty:{type:integer}, price:{type:number} }, required:[productId, qty, price] }
    Order: { type: object, properties: { id:{type:string}, createdAt:{type:string}, status:{type:string}, items:{ type:array, items:{ $ref:'#/components/schemas/OrderItem' } } }, required:[id, createdAt, status, items] }