openapi: 3.0.3
info:
  title: Gestao Loja API
  version: 1.0.0
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Healthcheck
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Login simples
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
              required: [username, password]
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Credenciais inválidas
  /auth/me:
    get:
      summary: Perfil do usuário (token)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil
        '401':
          description: Não autorizado
  /products:
    get:
      summary: Lista produtos
      responses:
        '200':
          description: OK
  /products/bulk/validate:
    post:
      summary: Valida produtos em lote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '400':
          description: Erro de validação
  /products/bulk:
    post:
      summary: Cria/atualiza produtos em lote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Criado
        '400':
          description: Erro de validação
  /orders:
    get:
      summary: Lista pedidos
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
        '401':
          description: Não autorizado
    post:
      summary: Cria pedido
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sku: { type: string }
                      qty: { type: number }
                channel: { type: string }
              required: [items]
      responses:
        '201':
          description: Criado
        '400':
          description: Erro de validação
        '401':
          description: Não autorizado
  /orders/{id}:
    patch:
      summary: Atualiza status do pedido
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
      responses:
        '200':
          description: OK
        '404':
          description: Não encontrado
        '401':
          description: Não autorizado
  /config:
    get:
      summary: Busca config
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
        '404':
          description: Não configurado
        '401':
          description: Não autorizado
    post:
      summary: Define config
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storeName: { type: string }
                currency:  { type: string }
                whatsappNumber: { type: string }
      responses:
        '201':
          description: Criado/atualizado
        '400':
          description: Erro de validação
        '401':
          description: Não autorizado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
