services:
  db:
    image: postgres:16-alpine
    container_name: gestao-loja-db
    environment:
      POSTGRES_DB: gestao_loja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_loja"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestao-loja-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: "production"
      # Se preferir por aqui:
      # DATABASE_URL: "postgresql://postgres:postgres@db:5432/gestao_loja?schema=public"
      # PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestao-loja-frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      NODE_ENV: "production"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  dbdata:
